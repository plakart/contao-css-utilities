services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            $bundles: '%kernel.bundles%'

    Plakart\CssUtilitiesBundle\:
        resource: '../src/'
        exclude:
            - '../src/ContaoManager/'
            - '../src/Util/'
            - '../src/PlakartCssUtilitiesBundle.php'
            - '../src/Target/Target.php'
            - '../src/ClassSelection/ClassGroup.php'
            - '../src/ClassSelection/SelectionNormalizer.php'
            - '../src/Widget/'

    Plakart\CssUtilitiesBundle\Target\TargetRegistry:
        public: true

    Plakart\CssUtilitiesBundle\ClassSelection\ClassGroupRepository:
        public: true
