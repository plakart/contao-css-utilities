services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            $bundles: '%kernel.bundles%'
            $presetFile: '%plakart_css_utilities.preset_file%'

    Plakart\CssUtilitiesBundle\:
        resource: '../src/'
        exclude:
            - '../src/ContaoManager/'
            - '../src/Util/'
            - '../src/PlakartCssUtilitiesBundle.php'
            - '../src/Target/Target.php'
            - '../src/ClassSelection/ClassGroup.php'
            - '../src/ClassSelection/SelectionNormalizer.php'
            - '../src/Widget/'
            - '../src/Preset/Preset.php'
            - '../src/Preset/PresetGroup.php'
            - '../src/Preset/PresetClass.php'
            - '../src/Preset/PresetSerializer.php'
            - '../src/Preset/InvalidPresetException.php'
            - '../src/Preset/ImportPlan.php'

    Plakart\CssUtilitiesBundle\Target\TargetRegistry:
        public: true

    Plakart\CssUtilitiesBundle\ClassSelection\ClassGroupRepository:
        public: true

    # Registered as array callbacks in LoadDataContainerListener
    Plakart\CssUtilitiesBundle\EventListener\DataContainer\ClassSelectionPaletteListener:
        public: true

    Plakart\CssUtilitiesBundle\EventListener\DataContainer\ClassAttributeListener:
        public: true
